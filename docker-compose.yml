services:
  mtproxy:
    build: .
    container_name: mtproxy
    restart: unless-stopped

    ports:
      - "${PORT:-443}:${PORT:-443}/tcp"

    environment:
      PORT: "${PORT:-443}"
      STATS_PORT: "${STATS_PORT:-2398}"
      DOMAIN: "${DOMAIN:-www.cloudflare.com}"
      WORKERS: "${WORKERS:-1}"
      EXTERNAL_IP: "${EXTERNAL_IP:-}"
      PROXY_TAG: "${PROXY_TAG:-}"
      CONTROL_DIR: "/control"
      LEGACY_SECRET_ENABLED: "${LEGACY_SECRET_ENABLED:-true}"
      SECRET_RELOAD_INTERVAL: "${SECRET_RELOAD_INTERVAL:-1}"

    volumes:
      - ./data:/data
      - mtproto-control-data:/control

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mtproto-control-data:
    name: warp-mtproto-control-data
